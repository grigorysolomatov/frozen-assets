<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frozen Assets</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <canvas id="snow"></canvas>

  <header>
    <div class="header-inner">
      <div class="logo">
        <svg class="penguin" viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="46" rx="20" ry="28" fill="#0f172a"/>
          <ellipse cx="32" cy="46" rx="12" ry="20" fill="#e0f2fe"/>
          <ellipse cx="14" cy="50" rx="8" ry="5" transform="rotate(-20 14 50)" fill="#0f172a"/>
          <ellipse cx="50" cy="50" rx="8" ry="5" transform="rotate(20 50 50)" fill="#0f172a"/>
          <ellipse cx="24" cy="72" rx="6" ry="3" fill="#f59e0b"/>
          <ellipse cx="40" cy="72" rx="6" ry="3" fill="#f59e0b"/>
          <ellipse cx="32" cy="18" rx="14" ry="14" fill="#0f172a"/>
          <circle cx="26" cy="14" r="3.5" fill="white"/>
          <circle cx="38" cy="14" r="3.5" fill="white"/>
          <circle cx="26.5" cy="14" r="1.5" fill="#0a0e1a"/>
          <circle cx="38.5" cy="14" r="1.5" fill="#0a0e1a"/>
          <ellipse cx="32" cy="22" rx="5" ry="3" fill="#f59e0b"/>
        </svg>
        <span class="logo-text">Frozen Assets</span>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>

  <main>
    <div class="card-grid" id="card-grid" role="tabpanel"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
